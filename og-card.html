<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f7f6f3;color:hsl(30 10% 11%);font-family:'Inter',system-ui,sans-serif}
  .dots{position:absolute;inset:0;background-image:radial-gradient(circle,hsl(40 8% 42% / 0.11) 1px,transparent 1px);background-size:24px 24px}
  .wrap{position:absolute;inset:0;padding:56px 72px 60px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:16px}
  .mark{width:56px;height:56px;display:block}
  .word{font:400 44px/1 'Instrument Serif',serif;letter-spacing:-.02em;color:#59592a}
  .eyebrow{font:500 14px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;color:hsl(35 9% 34%);margin-bottom:18px}
  .eyebrow i{font-style:normal;color:hsl(35 7% 42%)}
  h1{font:400 74px/1.02 'Instrument Serif',serif;letter-spacing:-.02em;margin:0;max-width:16ch}
  h1 em{font-style:italic;color:hsl(26 73% 51%)}
  .sub{font-size:25px;line-height:1.45;color:hsl(35 9% 34%);max-width:40ch;margin-top:22px}
  .foot{display:flex;gap:34px;font:500 16px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:hsl(26 80% 36%)}
  .foot span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:hsl(26 73% 51%);margin-right:12px;vertical-align:middle}
  .radar{position:absolute;right:64px;top:50%;transform:translateY(-50%);width:300px;height:300px}
  .radar circle.r{fill:none;stroke:hsl(40 9% 80%);stroke-width:1}
  .radar line{stroke:hsl(40 9% 80%);stroke-width:1}
  .radar .sweep{fill:hsl(26 73% 51% / 0.18)}
  .radar .hand{stroke:hsl(26 73% 51%);stroke-width:1.5}
  .radar .b{fill:hsl(26 73% 51%)}
  .radar .w{fill:#8c8c8c;opacity:.5}
</style></head><body>
<div class="dots"></div>
<svg class="radar" viewBox="0 0 100 100" aria-hidden="true">
  <circle class="r" cx="50" cy="50" r="46"/><circle class="r" cx="50" cy="50" r="34.5"/><circle class="r" cx="50" cy="50" r="23"/><circle class="r" cx="50" cy="50" r="11.5"/>
  <line x1="4" y1="50" x2="96" y2="50"/><line x1="50" y1="4" x2="50" y2="96"/>
  <path class="sweep" d="M50 50 L50 4 A46 46 0 0 1 89.8 27 Z"/>
  <line class="hand" x1="50" y1="50" x2="89.8" y2="27"/>
  <circle class="b" cx="58" cy="36" r="3.2"/><circle class="b" cx="41" cy="31" r="2.8"/><circle class="b" cx="37" cy="58" r="2.6"/><circle class="b" cx="66" cy="62" r="2.4"/>
  <circle class="w" cx="78" cy="78" r="2"/><circle class="w" cx="22" cy="74" r="2"/><circle class="w" cx="20" cy="40" r="2"/>
  <circle class="b" cx="50" cy="50" r="2"/>
</svg>
<div class="wrap">
  <div class="brand"><svg class="mark" viewBox="0 0 96 96" aria-hidden="true"><g fill="none" stroke="hsl(26 73% 51%)" stroke-width="6" stroke-linecap="round"><path d="M34 48A14 14 0 0 1 48 34M23 48A25 25 0 0 1 48 23M12 48A36 36 0 0 1 48 12"/><path d="M62 48A14 14 0 0 1 48 62M73 48A25 25 0 0 1 48 73M84 48A36 36 0 0 1 48 84"/></g><path d="M50.5 12.1A36 36 0 0 1 83.9 45.5L48 48Z" fill="hsl(26 73% 51%)" opacity=".55"/><path d="M45.5 83.9A36 36 0 0 1 12.1 50.5L48 48Z" fill="hsl(26 73% 51%)" opacity=".55"/><circle cx="48" cy="48" r="4.5" fill="hsl(26 73% 51%)"/></svg><span class="word">RoleRadar</span></div>
  <div>
    <div class="eyebrow"><i>//</i> early access · a private AI job-search assistant</div>
    <h1>Find the roles worth your time. <em>Send résumés you can stand behind.</em></h1>
    <p class="sub">Runs on your own PC. Scores every posting against your real background and fact-checks every résumé claim.</p>
  </div>
  <div class="foot"><span>Runs on your PC</span><span>You press Submit</span><span>No auto-apply spam</span></div>
</div>
</body></html>
