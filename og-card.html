<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0A1210;color:#E9F0EC;font-family:'Instrument Sans','Segoe UI',sans-serif}
  canvas{position:absolute;inset:0}
  .wrap{position:absolute;inset:0;padding:60px 72px 64px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:16px;font:800 40px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
  .mark{width:48px;height:48px}
  .mark .ring{fill:none;stroke:#5FD3C0;stroke-width:1.8;opacity:.85}
  .mark .sweep{fill:#F2B544;opacity:.9}
  .mark .blip{fill:#F2B544}
  h1{font:800 64px/1.04 'Bricolage Grotesque',sans-serif;letter-spacing:-.025em;margin:0;max-width:18ch}
  h1 em{font-style:normal;color:#5FD3C0}
  .sub{font-size:25px;line-height:1.4;color:#93A89F;max-width:40ch;margin-top:22px}
  .foot{display:flex;gap:36px;font:500 18px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#5FD3C0}
  .foot span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#6EE7A8;margin-right:12px;vertical-align:middle}
  .chip{position:absolute;right:72px;top:64px;font:500 16px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#1A1204;background:#F2B544;padding:12px 18px;border-radius:999px}
</style></head><body>
<canvas id="c" width="1200" height="630"></canvas>
<div class="wrap">
  <div class="brand">
    <svg class="mark" viewBox="0 0 30 30"><circle class="ring" cx="15" cy="15" r="13"/><circle class="ring" cx="15" cy="15" r="8"/><circle class="ring" cx="15" cy="15" r="3"/><path class="sweep" d="M15 15 L15 2 A13 13 0 0 1 26.3 8.5 Z"/><circle class="blip" cx="21" cy="10" r="2"/></svg>
    RoleRadar
  </div>
  <div>
    <h1>Find the roles worth your time. <em>Send résumés you can stand behind.</em></h1>
    <p class="sub">A private AI job-search assistant that runs on your own PC. It scores every posting against your real background and fact-checks every résumé claim.</p>
  </div>
  <div class="foot"><span>Runs on your PC</span><span>You press Submit</span><span>No auto-apply spam</span></div>
</div>
<div class="chip">Early access</div>
<script>
  var c=document.getElementById('c'),x=c.getContext('2d'),w=1200,h=630,N=30;
  for(var i=0;i<N;i++){var f=i/(N-1),base=h*0.12+f*h*0.98,amp=8+f*30;x.beginPath();
    for(var px=-10;px<=w+10;px+=10){var y=base+amp*(Math.sin(px*0.006+4*0.24+i*0.42)+0.55*Math.sin(px*0.014-4*0.17+i*0.9));px===-10?x.moveTo(px,y):x.lineTo(px,y);}
    x.lineTo(w+10,h+30);x.lineTo(-10,h+30);x.closePath();x.fillStyle='rgb(10,18,16)';x.fill();
    x.lineWidth=i%6===0?1.4:1;x.strokeStyle=i%6===0?'rgba(242,181,68,'+(0.18+0.3*f).toFixed(3)+')':'rgba(95,211,192,'+(0.07+0.22*f).toFixed(3)+')';x.stroke();}
</script>
</body></html>
