      if (line > 0 && endA > 0) { ctx.strokeStyle = rgba(ORANGE, .55 * endA); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(g.lamp.x, g.lamp.y); ctx.lineTo(lerp(g.lamp.x, n.x, line), lerp(g.lamp.y, n.y, line)); ctx.stroke(); lastLines.push([g.lamp.x, g.lamp.y, n.x, n.y]); }
      glow(glowSmall, n.x, n.y, 30, .9 * lit); ctx.fillStyle = rgba(ORANGE, lit); ctx.beginPath(); ctx.arc(n.x, n.y, 2.6, 0, 6.283); ctx.fill();
      if (lab > 0 && endA > 0) { drawLabel(labels[i], n, lab * endA, false); lastLabels.push(labels[i]); }
    } else {
      const hold = 1 - ramp(t, at + 2.4, at + 3.0), a = lit * hold;        // lights, holds two seconds, fades out completely
      if (a <= 0) { ctx.fillStyle = rgba(OFF, .12); ctx.beginPath(); ctx.arc(n.x, n.y, 1.4, 0, 6.283); ctx.fill(); return; }
      ctx.fillStyle = rgba(OFF, .75 * a); ctx.beginPath(); ctx.arc(n.x, n.y, 2.4, 0, 6.283); ctx.fill();
      const lab = seg(t, at + .3, at + .8) * hold;
      if (lab > 0) { drawLabel(labels[i], n, lab, true); lastLabels.push(labels[i]); }
    }
  });

  // the swap and the end card
  if (t >= 18.4) drawEndCard(g, t);
}

// ---------- the clock: runs only while the tab is visible; reduced motion shows the end card ----------
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
let elapsed = 0, last = 0, raf = 0, playing = false, frames = [], fps = 0, beamLog = [];
function tick(now) {
  if (!playing) return;
  if (last) { const dt = Math.min(now - last, 100) / 1000; elapsed = (elapsed + dt) % LOOP; frames.push(now); while (frames.length && now - frames[0] > 1000) frames.shift(); fps = frames.length; }
  last = now; render(elapsed); if (elapsed > SWEEP[0] && elapsed < SWEEP[1]) beamLog.push([elapsed, lastAngle]); if (beamLog.length > 2000) beamLog.shift(); raf = requestAnimationFrame(tick);
}
function play() { if (reduce.matches || playing) return; playing = true; last = 0; raf = requestAnimationFrame(tick); }
function pause() { playing = false; cancelAnimationFrame(raf); }
document.addEventListener('visibilitychange', () => document.hidden ? pause() : play());
reduce.addEventListener('change', () => { if (reduce.matches) { pause(); render(22); } else play(); });
addEventListener('resize', () => { if (!playing) render(reduce.matches ? 22 : elapsed); });
const fontsReady = Promise.race([Promise.all([document.fonts.load(`400 40px 'Instrument Serif'`), document.fonts.load(`400 16px 'Inter'`), document.fonts.load(`500 16px 'Inter'`)]).catch(() => {}), new Promise(r => setTimeout(r, 2500))]);
layout();
fontsReady.then(() => { layout(); if (reduce.matches) render(22); else play(); });
// for the proof scripts
window.__beacon = {
  seek(t) { pause(); elapsed = t % LOOP; render(elapsed); const g = G(); return { labels: lastLabels, lines: lastLines, log: g.log.rect, w: W, h: H, angle: lastAngle }; },
  play, fps: () => fps, tagline: TAGLINE, reduced: () => reduce.matches, playing: () => playing,
  beamLog: () => beamLog.slice(), startBeamLog: () => { beamLog = []; },
  geometry() { const g = G(); const b = dots.length ? { x: Math.min(...dots.map(d => d.x)), y: Math.min(...dots.map(d => d.y)), x2: Math.max(...dots.map(d => d.x)), y2: Math.max(...dots.map(d => d.y)) } : null; return { big: g.big, search: g.search, lamp: g.lamp, disc: g.disc, sweep: [A0, A1, SWEEP[0], SWEEP[1]], nameSize: g.nameSize, tagSize: g.tagSize, dots: dots.length, dotBounds: b, points: pts.length, strongDots: named.filter(n => n.kind === 's').map(n => n.dot ? [Math.round(n.dot.x), Math.round(n.dot.y)] : null), m: g.m }; },
  fonts: () => ({ serif: document.fonts.check(`400 40px 'Instrument Serif'`), inter: document.fonts.check(`400 16px 'Inter'`), loaded: [...document.fonts].filter(f => f.status === 'loaded').map(f => f.family + ' ' + f.weight) }),
};
})();
